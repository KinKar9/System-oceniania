services:
  postgres-db:
    image: postgres:16
    container_name: projekt_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: Projekt2026Haslo
      POSTGRES_USER: postgres
      POSTGRES_DB: system_oceniania
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

volumes:
  postgres-data: