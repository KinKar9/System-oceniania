<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Ocenami</title>
</head>
<body>
<main>
    <h1>Dziennik Ocen Cząstkowych</h1>

    <section aria-label="Filtrowanie ocen">
        <form th:action="@{/oceny}" method="get">
            <label for="filterStudent">Filtruj według studenta:</label>
            <select id="filterStudent" name="studentId">
                <option value="">-- Wszyscy studenci --</option>
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.imie + ' ' + s.nazwisko}"></option>
            </select>

            <label for="filterPrzedmiot">Przedmiot:</label>
            <select id="filterPrzedmiot" name="przedmiotId">
                <option value="">-- Wszystkie przedmioty --</option>
                <option th:each="p : ${przedmioty}" th:value="${p.id}" th:text="${p.nazwa}"></option>
            </select>

            <label for="filterTyp">Typ oceny:</label>
            <select id="filterTyp" name="typId">
                <option value="">-- Wszystkie typy --</option>
                <option th:each="t : ${typyOcen}" th:value="${t.id}" th:text="${t.nazwa}"></option>
            </select>

            <label for="dataOd">Data od (od aktualnej):</label>
            <input type="date" id="dataOd" name="dataOd" th:value="${param.dataOd}" />

            <a href="/oceny/popularnosc" class="btn">Sortuj według popularności przedmiotu</a>

            <button type="submit">Filtruj</button>
            <a href="/oceny">Wyczyść filtry</a>
        </form>
    </section>

    <br/>
    <div style="margin-bottom: 20px;">
        <a href="/oceny/nowa" role="button">➕ Wystaw nową ocenę</a>
    </div>

    <section aria-label="Lista ocen">
        <table border="1">
            <thead>
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Przedmiot</th>
                <th>Typ oceny</th>
                <th>Wartość</th>
                <th>Data wystawienia</th>
                <th>Komentarz</th>
                <th>Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${oceny}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.zapis.student.imie + ' ' + o.zapis.student.nazwisko}"></td>
                <td th:text="${o.zapis.grupa.przedmiot.nazwa}"></td>
                <td th:text="${o.typ.nazwa}"></td>
                <td th:text="${o.wartosc}"></td>
                <td th:text="${o.dataWystawienia}"></td>
                <td th:text="${o.komentarz}"></td>
                <td>
                    <a th:href="@{/oceny/usun/{id}(id=${o.id})}"
                       onclick="return confirm('Usunąć ocenę?')">Usuń</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
