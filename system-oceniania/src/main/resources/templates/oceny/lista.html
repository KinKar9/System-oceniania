<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Oceniania - Oceny</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            padding: 2rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ---------- NAGŁÓWEK ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header h1 span {
            font-weight: 300;
            opacity: 0.8;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* ---------- PRZYCISKI ---------- */
        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: white;
            color: #2d3748;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.4);
        }

        .btn-success {
            background: #38a169;
            color: white;
            box-shadow: 0 4px 15px rgba(56, 161, 105, 0.3);
        }
        .btn-success:hover {
            background: #2f855a;
            transform: translateY(-2px);
        }

        .btn-edit {
            background: #4299e1;
            color: white;
            padding: 0.3rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-edit:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-delete-sm {
            background: #fc8181;
            color: white;
            padding: 0.3rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-delete-sm:hover {
            background: #f56565;
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            text-decoration: none;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-filter {
            background: #4a5568;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-filter:hover {
            background: #2d3748;
        }

        .btn-clear {
            background: #718096;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-clear:hover {
            background: #4a5568;
        }

        /* ---------- FILTRY ---------- */
        .filter-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .filter-card h3 {
            color: #2d3748;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #4a5568;
            margin-bottom: 0.3rem;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.5rem 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: white;
            color: #2d3748;
            width: 100%;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: #4a5568;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 85, 104, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding-top: 0.3rem;
        }

        /* ---------- TABELA ---------- */
        .table-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
        }

        thead th {
            color: white;
            padding: 0.9rem 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        thead th:first-child {
            border-radius: 12px 0 0 0;
        }

        thead th:last-child {
            border-radius: 0 12px 0 0;
        }

        tbody tr {
            transition: background 0.2s ease;
            border-bottom: 1px solid #edf2f7;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 0.8rem 1rem;
            color: #2d3748;
            vertical-align: middle;
        }

        /* ---------- BADGE OCEN ---------- */
        .grade-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .grade-high { background: #c6f6d5; color: #22543d; }
        .grade-medium { background: #fefcbf; color: #744210; }
        .grade-low { background: #fed7d7; color: #9b2c2c; }

        /* ---------- KOMUNIKATY ---------- */
        .flash-message {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .flash-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }

        .flash-error {
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 4px solid #e53e3e;
        }

        /* ---------- PUSTY STAN ---------- */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .empty-state h3 {
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .empty-state p {
            color: #718096;
        }

        /* ---------- STOPKA ---------- */
        .footer {
            margin-top: 2rem;
            text-align: center;
        }

        .footer span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        /* ---------- RESPONSYWNOŚĆ ---------- */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header h1 { font-size: 1.6rem; }
            .table-wrapper { padding: 1rem; }
            table { font-size: 0.85rem; }
            thead th, tbody td { padding: 0.5rem 0.6rem; }
            .filter-grid {
                grid-template-columns: 1fr 1fr;
            }
            .filter-actions {
                grid-column: span 2;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                flex-direction: column;
            }
            .btn {
                text-align: center;
            }
            .filter-grid {
                grid-template-columns: 1fr;
            }
            .filter-actions {
                grid-column: span 1;
                flex-direction: column;
            }
            .filter-actions .btn,
            .filter-actions .btn-clear {
                width: 100%;
                text-align: center;
            }
            table {
                font-size: 0.75rem;
            }
            thead th, tbody td {
                padding: 0.3rem 0.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ====== NAGŁÓWEK ====== -->
    <div class="header">
        <h1>📊 <span>Zarządzanie Ocenami</span></h1>
        <div class="header-actions">
            <a th:href="@{/oceny/nowa}" class="btn btn-success">➕ Nowa ocena</a>
            <a th:href="@{/dashboard}" class="btn btn-back">← Powrót</a>
        </div>
    </div>

    <!-- ====== KOMUNIKATY ====== -->
    <div th:if="${error}" class="flash-message flash-error" th:text="${error}"></div>
    <div th:if="${success}" class="flash-message flash-success" th:text="${success}"></div>

    <!-- ====== FILTRY ====== -->
    <div class="filter-card">
        <h3>🔍 Filtruj oceny</h3>
        <form th:action="@{/oceny}" method="get">
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="filterStudent">Student</label>
                    <select id="filterStudent" name="studentId">
                        <option value="">-- Wszyscy studenci --</option>
                        <option th:each="s : ${students}"
                                th:value="${s.id}"
                                th:text="${s.imie + ' ' + s.nazwisko}"
                                th:selected="${param.studentId != null and param.studentId[0] == s.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterPrzedmiot">Przedmiot</label>
                    <select id="filterPrzedmiot" name="przedmiotId">
                        <option value="">-- Wszystkie przedmioty --</option>
                        <option th:each="p : ${przedmioty}"
                                th:value="${p.id}"
                                th:text="${p.nazwa}"
                                th:selected="${param.przedmiotId != null and param.przedmiotId[0] == p.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterTyp">Typ oceny</label>
                    <select id="filterTyp" name="typId">
                        <option value="">-- Wszystkie typy --</option>
                        <option th:each="t : ${typyOcen}"
                                th:value="${t.id}"
                                th:text="${t.nazwa}"
                                th:selected="${param.typId != null and param.typId[0] == t.id.toString()}">
                        </option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="dataOd">Data od</label>
                    <input type="date" id="dataOd" name="dataOd" th:value="${selectedDataOd}" />
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn-filter">🔎 Filtruj</button>
                    <a th:href="@{/oceny}" class="btn-clear">✖ Wyczyść</a>
                </div>
            </div>
        </form>
    </div>

    <!-- ====== TABELA ====== -->
    <div class="table-wrapper">
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Przedmiot</th>
                    <th>Typ</th>
                    <th>Ocena</th>
                    <th>Data</th>
                    <th>Komentarz</th>
                    <th style="text-align: center;">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(oceny)}">
                    <td colspan="8">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <h3>Brak ocen</h3>
                            <p>Nie znaleziono ocen spełniających kryteria.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="o : ${oceny}" th:unless="${#lists.isEmpty(oceny)}">
                    <td th:text="${o.id}">1</td>
                    <td th:text="${o.zapis.student.imie + ' ' + o.zapis.student.nazwisko}">Jan Kowalski</td>
                    <td th:text="${o.zapis.grupa.przedmiot.nazwa}">Matematyka</td>
                    <td th:text="${o.typ.nazwa}">Kolokwium</td>
                    <td>
                            <span class="grade-badge"
                                  th:classappend="${o.wartosc >= 4.0 ? 'grade-high' : (o.wartosc >= 3.0 ? 'grade-medium' : 'grade-low')}"
                                  th:text="${o.wartosc}">4.5</span>
                    </td>
                    <td th:text="${o.dataWystawienia != null ? #temporals.format(o.dataWystawienia, 'dd-MM-yyyy') : '-'}">15-06-2024</td>
                    <td th:text="${o.komentarz ?: '-'}">Brak</td>
                    <td>
                        <form th:action="@{/oceny/usun/{id}(id=${o.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn-delete-sm"
                                    onclick="return confirm('Czy na pewno chcesz usunąć tę ocenę?')">
                                🗑️
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ====== STOPKA ====== -->
    <div class="footer">
        <span>System Oceniania &bull; Zarządzanie ocenami</span>
    </div>
</div>

</body>
</html>
