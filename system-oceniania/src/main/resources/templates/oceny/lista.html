<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Ocenami</title>
</head>
<body>
<main>
    <h1>Dziennik Ocen Cząstkowych</h1>

    <section aria-label="Filtrowanie ocen">
        <form th:action="@{/oceny}" method="get">
            <label for="filterStudent">Filtruj według studenta:</label>
            <select id="filterStudent" name="studentId">
                <option value="">-- Wszyscy studenci --</option>
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.imie + ' ' + s.nazwisko}"></option>
            </select>
            <button type="submit">Filtruj</button>
            <a href="/oceny" th:if="${param.studentId != null}">Wyczyść filtr</a>
        </form>
    </section>

    <br/>
    <div style="margin-bottom: 20px;">
        <a href="/oceny/nowa" role="button" aria-label="Wystaw nową ocenę">➕ Wystaw nową ocenę</a>
    </div>

    <section aria-label="Lista ocen">
        <table border="1">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Student</th>
                <th scope="col">Przedmiot</th>
                <th scope="col">Ocena</th>
                <th scope="col">Waga</th>
                <th scope="col">Opis</th>
                <th scope="col">Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${oceny}">
                <td th:text="${o.id}">1</td>
                <td th:text="${o.student.imie + ' ' + o.student.nazwisko}">Jan Kowalski</td>
                <td th:text="${o.przedmiot != null ? o.przedmiot.nazwa : 'Brak'}">Matematyka</td>
                <td th:text="${o.wartosc}" style="font-weight: bold;">4.5</td>
                <td th:text="${o.waga}">2</td>
                <td th:text="${o.opis}">Kolokwium 1</td>
                <td>
                    <a th:href="@{/oceny/usun/{id}(id=${o.id})}"
                       th:aria-label="'Usuń ocenę o ID ' + ${o.id}"
                       onclick="return confirm('Usunąć tę ocenę?')">❌ Usuń</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
