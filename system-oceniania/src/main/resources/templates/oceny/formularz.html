<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wystaw ocenę</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .card-header .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2d3748;
    }

    .card-header p {
      color: #718096;
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #2d3748;
      margin-bottom: 0.4rem;
    }

    .form-group label .required {
      color: #e53e3e;
      margin-left: 2px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
      color: #2d3748;
      font-family: inherit;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #4a5568;
      outline: none;
      box-shadow: 0 0 0 4px rgba(74, 85, 104, 0.15);
    }

    .form-group select.error,
    .form-group input.error {
      border-color: #fc8181;
    }

    .form-group select.error:focus,
    .form-group input.error:focus {
      box-shadow: 0 0 0 4px rgba(252, 129, 129, 0.15);
    }

    .form-group .error-message {
      display: block;
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 0.3rem;
      padding: 0.3rem 0.8rem;
      background: #fff5f5;
      border-radius: 8px;
      border-left: 3px solid #e53e3e;
    }

    .form-group .helper {
      display: block;
      color: #a0aec0;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .form-group .value-hint {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.85rem;
      color: #718096;
    }

    .form-group .value-hint span {
      font-weight: 600;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      flex: 1;
      min-width: 140px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(56, 161, 105, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56, 161, 105, 0.5);
    }

    .btn-secondary {
      background: #edf2f7;
      color: #2d3748;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(5px);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .flash-message {
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .flash-success {
      background: #c6f6d5;
      color: #22543d;
      border-left: 4px solid #38a169;
    }

    .flash-error {
      background: #fed7d7;
      color: #9b2c2c;
      border-left: 4px solid #e53e3e;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .card { padding: 1.5rem; }
      .card-header h1 { font-size: 1.4rem; }
      .form-actions {
        flex-direction: column;
      }
      .btn {
        flex: none;
        width: 100%;
      }
      .form-group select,
      .form-group input {
        font-size: 0.95rem;
        padding: 0.65rem 0.85rem;
      }
    }

    @media (max-width: 480px) {
      .card { padding: 1.2rem; }
      .card-header .icon { font-size: 2rem; }
      .card-header h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">

    <!-- ====== NAGŁÓWEK ====== -->
    <div class="card-header">
      <span class="icon" th:text="${ocena.id == null} ? '📝' : '✏️'"></span>
      <h1 th:text="${ocena.id == null} ? 'Wystaw nową ocenę' : 'Edytuj ocenę'">Wystaw nową ocenę</h1>
      <p th:text="${ocena.id == null} ? 'Wprowadź dane oceny cząstkowej' : 'Zmień dane wybranej oceny'">Wprowadź dane</p>
    </div>

    <!-- ====== KOMUNIKATY ====== -->
    <div th:if="${flashMessage}" class="flash-message" th:classappend="${flashType == 'success' ? 'flash-success' : 'flash-error'}" th:text="${flashMessage}"></div>

    <!-- ====== FORMULARZ ====== -->
    <form th:action="@{/oceny/zapisz}" th:object="${ocena}" method="post" novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="hidden" th:field="*{id}" />

      <!-- ZAPIS (Student + Przedmiot) -->
      <div class="form-group">
        <label for="zapis">
          👨‍🎓 Student / Przedmiot <span class="required">*</span>
        </label>
        <select id="zapis" th:field="*{zapis.id}" required>
          <option value="">— Wybierz zapis —</option>
          <option th:each="z : ${wszystkieZapisy}"
                  th:value="${z.id}"
                  th:text="${z.student.imie + ' ' + z.student.nazwisko + ' - ' + z.grupa.przedmiot.nazwa + ' (' + z.grupa.nazwaGrupy + ')'}">
          </option>
        </select>
        <span class="error-message" th:if="${#fields.hasErrors('zapis')}" th:errors="*{zapis}"></span>
      </div>

      <!-- TYP OCENY -->
      <div class="form-group">
        <label for="typ">
          📌 Typ oceny <span class="required">*</span>
        </label>
        <select id="typ" th:field="*{typ.id}" required>
          <option value="">— Wybierz typ —</option>
          <option th:each="t : ${typyOcen}"
                  th:value="${t.id}"
                  th:text="${t.nazwa + ' (waga: ' + t.waga + ')'}">
          </option>
        </select>
        <span class="error-message" th:if="${#fields.hasErrors('typ')}" th:errors="*{typ}"></span>
      </div>

      <!-- WARTOŚĆ -->
      <div class="form-group">
        <label for="wartosc">
          📊 Wartość oceny <span class="required">*</span>
        </label>
        <input type="number"
               step="0.5"
               min="2.0"
               max="5.0"
               id="wartosc"
               th:field="*{wartosc}"
               placeholder="np. 4.5"
               required />
        <span class="value-hint">Dozwolone wartości: <span>2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0</span></span>
        <span class="error-message" th:if="${#fields.hasErrors('wartosc')}" th:errors="*{wartosc}"></span>
      </div>

      <!-- KOMENTARZ -->
      <div class="form-group">
        <label for="komentarz">
          💬 Komentarz
        </label>
        <input type="text"
               id="komentarz"
               th:field="*{komentarz}"
               placeholder="Opcjonalny komentarz do oceny"
               maxlength="200" />
        <span class="helper">Opcjonalne – maksymalnie 200 znaków</span>
        <span class="error-message" th:if="${#fields.hasErrors('komentarz')}" th:errors="*{komentarz}"></span>
      </div>

      <!-- PRZYCISKI -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          💾 Wystaw ocenę
        </button>
        <a th:href="@{/oceny}" class="btn btn-secondary">
          ❌ Anuluj
        </a>
      </div>
    </form>

  </div>

  <!-- ====== POWRÓT DO PANELU ====== -->
  <div style="margin-top: 1.5rem; text-align: center;">
    <a th:href="@{/dashboard}" class="btn-back">← Powrót do panelu</a>
  </div>
</div>

</body>
</html>
