<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz Kierunku</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-header .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
        }

        .card-header p {
            color: #718096;
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2d3748;
            margin-bottom: 0.4rem;
        }

        .form-group label .required {
            color: #e53e3e;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #2d3748;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4a5568;
            outline: none;
            box-shadow: 0 0 0 4px rgba(74, 85, 104, 0.15);
        }

        .form-group input.error,
        .form-group select.error {
            border-color: #fc8181;
        }

        .form-group input.error:focus,
        .form-group select.error:focus {
            box-shadow: 0 0 0 4px rgba(252, 129, 129, 0.15);
        }

        .form-group .error-message {
            display: block;
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            padding: 0.3rem 0.8rem;
            background: #fff5f5;
            border-radius: 8px;
            border-left: 3px solid #e53e3e;
        }

        .form-group .helper {
            display: block;
            color: #a0aec0;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            flex: 1;
            min-width: 140px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(45, 55, 72, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45, 55, 72, 0.5);
        }

        .btn-secondary {
            background: #edf2f7;
            color: #2d3748;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .flash-message {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .flash-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }

        .flash-error {
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 4px solid #e53e3e;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            .card { padding: 1.5rem; }
            .card-header h1 { font-size: 1.4rem; }
            .form-actions {
                flex-direction: column;
            }
            .btn {
                flex: none;
                width: 100%;
            }
            .form-group input,
            .form-group select {
                font-size: 0.95rem;
                padding: 0.65rem 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            .card-header .icon { font-size: 2rem; }
            .card-header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <!-- ====== NAGŁÓWEK ====== -->
        <div class="card-header">
            <span class="icon" th:text="${kierunek.id == null} ? '🎓' : '✏️'"></span>
            <h1 th:text="${kierunek.id == null} ? 'Dodaj nowy kierunek' : 'Edytuj kierunek'">Dodaj nowy kierunek</h1>
            <p th:text="${kierunek.id == null} ? 'Wprowadź dane nowego kierunku' : 'Zmień dane wybranego kierunku'">Wprowadź dane</p>
        </div>

        <!-- ====== KOMUNIKATY ====== -->
        <div th:if="${flashMessage}" class="flash-message" th:classappend="${flashType == 'success' ? 'flash-success' : 'flash-error'}" th:text="${flashMessage}"></div>

        <!-- ====== FORMULARZ ====== -->
        <form th:action="@{/kierunki/zapisz}" th:object="${kierunek}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <!-- KOD KIERUNKU -->
            <div class="form-group">
                <label for="kodKierunku">
                    🔑 Kod kierunku <span class="required">*</span>
                </label>
                <input type="text"
                       id="kodKierunku"
                       th:field="*{kodKierunku}"
                       th:classappend="${#fields.hasErrors('kodKierunku')} ? 'error' : ''"
                       placeholder="np. INF"
                       required
                       aria-required="true" />
                <span class="helper">Unikalny kod – duże litery i cyfry</span>
                <span class="error-message"
                      th:if="${#fields.hasErrors('kodKierunku')}"
                      th:errors="*{kodKierunku}">
                    Błąd kodu
                </span>
            </div>

            <!-- NAZWA -->
            <div class="form-group">
                <label for="nazwa">
                    📛 Nazwa kierunku <span class="required">*</span>
                </label>
                <input type="text"
                       id="nazwa"
                       th:field="*{nazwa}"
                       th:classappend="${#fields.hasErrors('nazwa')} ? 'error' : ''"
                       placeholder="np. Informatyka"
                       required
                       aria-required="true" />
                <span class="error-message"
                      th:if="${#fields.hasErrors('nazwa')}"
                      th:errors="*{nazwa}">
                    Błąd nazwy
                </span>
            </div>

            <!-- STOPIEŃ -->
            <div class="form-group">
                <label for="stopien">
                    📊 Stopień <span class="required">*</span>
                </label>
                <select id="stopien"
                        th:field="*{stopien}"
                        th:classappend="${#fields.hasErrors('stopien')} ? 'error' : ''"
                        required
                        aria-required="true">
                    <option value="">— Wybierz stopień —</option>
                    <option value="INZYNIER_LICENCJAT">Inżynier / Licencjat (I stopień)</option>
                    <option value="MAGISTER">Magister (II stopień)</option>
                </select>
                <span class="error-message"
                      th:if="${#fields.hasErrors('stopien')}"
                      th:errors="*{stopien}">
                    Błąd stopnia
                </span>
            </div>

            <!-- PRZYCISKI -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    💾 Zapisz kierunek
                </button>
                <a th:href="@{/kierunki}" class="btn btn-secondary">
                    ❌ Anuluj
                </a>
            </div>
        </form>

    </div>
    <div style="margin-top: 1.5rem; text-align: center;">
        <a th:href="@{/dashboard}" class="btn-back">← Powrót do panelu</a>
    </div>
</div>

</body>
</html>
