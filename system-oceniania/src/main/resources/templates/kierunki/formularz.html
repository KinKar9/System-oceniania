<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz kierunku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f4f7fa;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input {
            padding: 6px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #27ae60;
        }
        .error-message {
            color: red;
            font-size: 0.9em;
            display: block;
            margin-top: 4px;
        }
        .global-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
        }
        .actions {
            margin-top: 1.5rem;
        }
        .cancel-link {
            margin-left: 10px;
            color: #666;
            text-decoration: none;
        }
        .cancel-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main>
    <h1 th:text="${kierunek.id == null} ? 'Nowy kierunek' : 'Edycja kierunku'">Formularz</h1>

    <!-- Formularz z novalidate i tokenem CSRF -->
    <form th:action="@{/kierunki/zapisz}" th:object="${kierunek}" method="post" novalidate>
        <input type="hidden" th:field="*{id}" />
        <!-- Token CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Błędy globalne -->
        <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>

        <div class="form-group">
            <label for="nazwa">Nazwa:</label>
            <input type="text" id="nazwa" th:field="*{nazwa}" required />
            <span th:if="${#fields.hasErrors('nazwa')}" th:errors="*{nazwa}" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="kodKierunku">Kod kierunku:</label>
            <input type="text" id="kodKierunku" th:field="*{kodKierunku}" required />
            <span th:if="${#fields.hasErrors('kodKierunku')}" th:errors="*{kodKierunku}" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="stopien">Stopień (1 lub 2):</label>
            <input type="number" id="stopien" th:field="*{stopien}" min="1" max="2" required />
            <span th:if="${#fields.hasErrors('stopien')}" th:errors="*{stopien}" class="error-message"></span>
        </div>

        <div class="actions">
            <button type="submit">Zapisz</button>
            <a th:href="@{/kierunki}" class="cancel-link">Anuluj</a>
        </div>
    </form>
</main>
</body>
</html>
