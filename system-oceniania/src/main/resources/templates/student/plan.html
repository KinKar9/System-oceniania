<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój plan zajęć</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        h1 {
            color: white;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(5px);
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:hover td {
            background: #f7fafc;
        }
        .empty-message {
            text-align: center;
            padding: 2rem;
            color: #4a5568;
            font-size: 1.1rem;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-monday { background: #feb2b2; color: #9b2c2c; }
        .badge-tuesday { background: #fbd38d; color: #744210; }
        .badge-wednesday { background: #f6e05e; color: #744210; }
        .badge-thursday { background: #9ae6b4; color: #22543d; }
        .badge-friday { background: #90cdf4; color: #2a4365; }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .container { padding: 0; }
            .card { padding: 1rem; }
            table { font-size: 0.85rem; }
            th, td { padding: 8px 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📅 Mój plan zajęć</h1>
        <a th:href="@{/dashboard}" class="btn btn-back">← Powrót do dashboardu</a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Dzień tygodnia</th>
                <th>Godzina</th>
                <th>Przedmiot</th>
                <th>Sala</th>
                <th>Prowadzący</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(plan)}">
                <td colspan="5" class="empty-message">
                    📭 Brak zajęć w planie na bieżący semestr.
                </td>
            </tr>
            <tr th:each="p : ${plan}">
                <td>
                        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(p.dzienTygodnia)}"
                              th:text="${p.dzienTygodnia}">PONIEDZIALEK</span>
                </td>
                <td th:text="${#temporals.format(p.godzinaRozpoczecia, 'HH:mm')} + ' - ' + ${#temporals.format(p.godzinaZakonczenia, 'HH:mm')}">
                    08:00 - 09:30
                </td>
                <td th:text="${p.przedmiot.nazwa}">Matematyka</td>
                <td th:text="${p.sala.numerSali}">A-101</td>
                <td th:text="${p.prowadzacy.username}">dr Kowalski</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
