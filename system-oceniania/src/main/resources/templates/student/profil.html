<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój profil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f4f7fa;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1.5rem;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .field {
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .label {
            font-weight: bold;
            width: 150px;
            flex-shrink: 0;
        }
        .value {
            flex: 1;
        }
        .btn {
            background: #0066cc;
            color: white;
            padding: 0.5rem 1rem;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
            margin-top: 1rem;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #0055aa;
        }
        @media (max-width: 480px) {
            .field {
                flex-direction: column;
            }
            .label {
                width: auto;
                margin-bottom: 0.25rem;
            }
            .container {
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Profil studenta</h1>
    <div class="card">
        <div class="field">
            <span class="label">Imię i nazwisko:</span>
            <span class="value" th:text="${(student.imie ?: '') + ' ' + (student.nazwisko ?: '')}">-</span>
        </div>
        <div class="field">
            <span class="label">Numer indeksu:</span>
            <span class="value" th:text="${student.nrIndeksu ?: '-'}">-</span>
        </div>
        <div class="field">
            <span class="label">Email:</span>
            <span class="value" th:text="${student.email ?: '-'}">-</span>
        </div>
        <div class="field">
            <span class="label">Data urodzenia:</span>
            <span class="value" th:text="${student.dataUrodzenia != null ? #temporals.format(student.dataUrodzenia, 'dd-MM-yyyy') : 'brak'}">-</span>
        </div>
        <div class="field">
            <span class="label">PESEL:</span>
            <span class="value" th:text="${student.pesel != null and #strings.length(student.pesel) >= 7 ? '***' + #strings.substring(student.pesel, 7) : 'brak'}">-</span>
        </div>
        <div class="field">
            <span class="label">Link publiczny:</span>
            <span class="value">
        <a th:if="${student.secureToken != null}"
           th:href="@{/public/student/{token}(token=${student.secureToken})}"
           target="_blank">
            Zobacz profil publiczny
        </a>
        <span th:unless="${student.secureToken != null}">Brak wygenerowanego linku</span>
    </span>
        </div>
    </div>
    <a th:href="@{/student/dashboard}" class="btn">Powrót do panelu</a>
</div>
</body>
</html>
