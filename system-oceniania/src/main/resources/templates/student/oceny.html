<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje oceny</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        h1 { color: white; font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(5px);
        }
        .btn-back:hover { background: rgba(255,255,255,0.3); }
        .card {
            background: white;
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .srednia-box {
            background: linear-gradient(135deg, #ebf8ff, #bee3f8);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .srednia-box strong { font-size: 1.1rem; color: #2b6cb0; }
        .srednia-box .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2b6cb0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f7fafc;
            color: #2d3748;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:hover td { background: #f7fafc; }
        .empty-message {
            text-align: center;
            padding: 2rem;
            color: #4a5568;
            font-size: 1.1rem;
        }
        .grade-good { color: #38a169; font-weight: 700; }
        .grade-medium { color: #d69e2e; font-weight: 700; }
        .grade-bad { color: #e53e3e; font-weight: 700; }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .card { padding: 1rem; }
            table { font-size: 0.85rem; }
            th, td { padding: 8px 10px; }
            .srednia-box .value { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Moje oceny</h1>
        <a th:href="@{/dashboard}" class="btn btn-back">← Powrót</a>
    </div>

    <div class="card">
        <div class="srednia-box">
            <strong>📈 Średnia ważona:</strong>
            <span class="value" th:text="${srednia != null ? srednia : '0.00'}">4.50</span>
        </div>

        <div th:if="${#lists.isEmpty(oceny)}" class="empty-message">
            📭 Brak wystawionych ocen.
        </div>

        <table th:if="${!#lists.isEmpty(oceny)}">
            <thead>
            <tr>
                <th>Przedmiot</th>
                <th>Typ oceny</th>
                <th>Ocena</th>
                <th>Data wystawienia</th>
                <th>Komentarz</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${oceny}">
                <td th:text="${o.zapis.grupa.przedmiot.nazwa}">-</td>
                <td th:text="${o.typ.nazwa}">-</td>
                <td>
                        <span th:classappend="${o.wartosc >= 4.0 ? 'grade-good' : (o.wartosc >= 3.0 ? 'grade-medium' : 'grade-bad')}"
                              th:text="${o.wartosc}">4.5</span>
                </td>
                <td th:text="${#temporals.format(o.dataWystawienia, 'dd-MM-yyyy')}">-</td>
                <td th:text="${o.komentarz}">-</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
