<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Oceniania - Nowa Sala</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
            padding: 20px;
        }
        h1 { color: #0d47a1; }
        .form-group {
            margin-bottom: 15px;
            max-width: 400px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 2px solid #111111;
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus {
            outline: 3px solid #ffb300;
        }
        .btn {
            padding: 10px 20px;
            background-color: #0d47a1;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover, .btn:focus {
            background-color: #111111;
            outline: 3px solid #ffb300;
        }
        .btn-secondary {
            background-color: #efefef;
            color: #111111;
            border: 2px solid #111111;
            text-decoration: none;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<main>
    <h1>Dodaj Nową Salę</h1>

    <form th:action="@{/sale/zapisz}" th:object="${sala}" method="post">

        <div class="form-group">
            <label for="numerSali">Numer sali:</label>
            <input type="text" id="numerSali" th:field="*{numerSali}" required placeholder="np. 314 lub LAB-02"/>
        </div>

        <div class="form-group">
            <label for="pojemnosc">Pojemność (liczba miejsc):</label>
            <input type="number" id="pojemnosc" th:field="*{pojemnosc}" min="1" max="300" required placeholder="np. 30"/>
        </div>

        <button type="submit" class="btn">Zapisz salę</button>
        <a href="/sale" class="btn btn-secondary">Anuluj</a>
    </form>
</main>

</body>
</html>
