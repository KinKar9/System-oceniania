<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz Sali</title>
    <style>
        /* ---------- RESET I GLOBALNE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ---------- KARTA ---------- */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ---------- NAGŁÓWEK ---------- */
        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-header .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
        }

        .card-header p {
            color: #718096;
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        /* ---------- POLA FORMULARZA ---------- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2d3748;
            margin-bottom: 0.4rem;
        }

        .form-group label .required {
            color: #e53e3e;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #2d3748;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .form-group input.error,
        .form-group select.error {
            border-color: #fc8181;
        }

        .form-group input.error:focus,
        .form-group select.error:focus {
            box-shadow: 0 0 0 4px rgba(252, 129, 129, 0.15);
        }

        .form-group .error-message {
            display: block;
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            padding: 0.3rem 0.8rem;
            background: #fff5f5;
            border-radius: 8px;
            border-left: 3px solid #e53e3e;
        }

        /* ---------- PRZYCISKI ---------- */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            flex: 1;
            min-width: 140px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: #edf2f7;
            color: #2d3748;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* ---------- KOMUNIKATY ---------- */
        .flash-message {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .flash-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }

        .flash-error {
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 4px solid #e53e3e;
        }

        /* ---------- RESPONSYWNOŚĆ ---------- */
        @media (max-width: 640px) {
            body { padding: 1rem; }

            .card { padding: 1.5rem; }

            .card-header h1 { font-size: 1.4rem; }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                flex: none;
                width: 100%;
            }

            .form-group input,
            .form-group select {
                font-size: 0.95rem;
                padding: 0.65rem 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            .card-header .icon { font-size: 2rem; }
            .card-header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <!-- ====== NAGŁÓWEK ====== -->
        <div class="card-header">
            <span class="icon" th:text="${sala.id == null} ? '🏗️' : '✏️'"></span>
            <h1 th:text="${sala.id == null} ? 'Dodaj nową salę' : 'Edytuj salę'">Dodaj nową salę</h1>
            <p th:text="${sala.id == null} ? 'Wprowadź dane nowej sali' : 'Zmień dane wybranej sali'">Wprowadź dane</p>
        </div>

        <!-- ====== KOMUNIKATY FLASH ====== -->
        <div th:if="${flashMessage}" class="flash-message" th:classappend="${flashType == 'success' ? 'flash-success' : 'flash-error'}" th:text="${flashMessage}"></div>

        <!-- ====== FORMULARZ ====== -->
        <form th:action="@{/sale/zapisz}" th:object="${sala}" method="post" novalidate>
            <!-- CSRF + ID -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <!-- NUMER SALI -->
            <div class="form-group">
                <label for="numerSali">
                    🏷️ Numer sali <span class="required">*</span>
                </label>
                <input type="text"
                       id="numerSali"
                       th:field="*{numerSali}"
                       th:classappend="${#fields.hasErrors('numerSali')} ? 'error' : ''"
                       placeholder="np. 104-A, 215-B"
                       required
                       aria-required="true" />
                <span class="error-message"
                      th:if="${#fields.hasErrors('numerSali')}"
                      th:errors="*{numerSali}">
                    Błąd numeru
                </span>
            </div>

            <!-- POJEMNOŚĆ -->
            <div class="form-group">
                <label for="pojemnosc">
                    👥 Pojemność sali <span class="required">*</span>
                </label>
                <input type="number"
                       id="pojemnosc"
                       th:field="*{pojemnosc}"
                       th:classappend="${#fields.hasErrors('pojemnosc')} ? 'error' : ''"
                       placeholder="np. 30"
                       min="1"
                       max="500"
                       required
                       aria-required="true" />
                <span class="error-message"
                      th:if="${#fields.hasErrors('pojemnosc')}"
                      th:errors="*{pojemnosc}">
                    Błąd pojemności
                </span>
            </div>

            <!-- TYP SALI -->
            <div class="form-group">
                <label for="typSali">
                    📌 Typ sali <span class="required">*</span>
                </label>
                <select id="typSali"
                        th:field="*{typSali}"
                        th:classappend="${#fields.hasErrors('typSali')} ? 'error' : ''"
                        required
                        aria-required="true">
                    <option value="">— Wybierz typ —</option>
                    <option th:each="typ : ${T(pl.studenci.systemoceniania.entity.Sala.TypSali).values()}"
                            th:value="${typ}"
                            th:text="${typ}">
                        WYKLADOWA
                    </option>
                </select>
                <span class="error-message"
                      th:if="${#fields.hasErrors('typSali')}"
                      th:errors="*{typSali}">
                    Błąd typu
                </span>
            </div>

            <!-- PRZYCISKI -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    💾 Zapisz salę
                </button>
                <a th:href="@{/sale}" class="btn btn-secondary">
                    ❌ Anuluj
                </a>
            </div>
        </form>

    </div>

    <!-- ====== POWRÓT DO PANELU ====== -->
    <div style="margin-top: 1.5rem; text-align: center;">
        <a th:href="@{/dashboard}" class="btn-back">← Powrót do panelu</a>
    </div>
</div>

</body>
</html>
