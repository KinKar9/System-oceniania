<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularz Sali</title>
</head>
<body>
<main>
    <h1 th:text="${sala.id == null} ? 'Dodaj nową salę' : 'Edytuj salę'">Formularz Sali</h1>

    <section aria-labelledby="form-sala">
        <h2 id="form-sala" th:text="${sala.id == null} ? 'Wprowadź dane nowej sali' : 'Zmień dane sali'">Dane sali</h2>

        <form th:action="@{/sale/zapisz}" th:object="${sala}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="numerSali">Numer sali:</label>
                <input type="text" id="numerSali" th:field="*{numerSali}" aria-required="true" />
                <span th:if="${#fields.hasErrors('numerSali')}" th:errors="*{numerSali}" style="color: red;" role="alert">Błąd numeru</span>
            </div>

            <br/>

            <div>
                <label for="pojemnosc">Pojemność sali:</label>
                <input type="number" id="pojemnosc" th:field="*{pojemnosc}" aria-required="true" />
                <span th:if="${#fields.hasErrors('pojemnosc')}" th:errors="*{pojemnosc}" style="color: red;" role="alert">Błąd pojemności</span>
            </div>

            <br/>

            <button type="submit" aria-label="Zatwierdź i zapisz salę">Zapisz salę</button>
            <a href="/sale" style="margin-left: 10px;">Anuluj</a>
        </form>
    </section>
</main>
</body>
</html>
