<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>System Oceniania - Sale</title>
</head>
<body>
<main>
  <h1 id="main-heading">Zarządzanie Salami</h1>

  <div style="margin-bottom: 20px;">
    <a href="/sale/nowy" role="button" aria-label="Przejdź do formularza dodawania nowej sali">➕ Dodaj nową salę</a>
  </div>

  <section aria-label="Tabela sal lekcyjnych">
    <h2>Lista sal lekcyjnych</h2>
    <table border="1">
      <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Numer sali</th>
        <th scope="col">Pojemność</th>
        <th scope="col">Akcje</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="s : ${sale}">
        <td th:text="${s.id}">1</td>
        <td th:text="${s.numerSali}">104-A</td>
        <td th:text="${s.pojemnosc}">30</td>
        <td>
          <a th:href="@{/sale/edycja/{id}(id=${s.id})}"
             th:aria-label="'Edytuj salę numer ' + ${s.numerSali}">Edytuj</a> |

          <a th:href="@{/sale/usun/{id}(id=${s.id})}"
             th:aria-label="'Usuń salę numer ' + ${s.numerSali}"
             onclick="return confirm('Czy na pewno chcesz usunąć tę salę?')">Usuń</a>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
