<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pozycja planu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { width: 100%; max-width: 650px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .card-header { text-align: center; margin-bottom: 2rem; }
    .card-header h1 { font-size: 1.8rem; color: #2d3748; }
    .card-header p { color: #718096; }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 600; color: #2d3748; margin-bottom: 0.3rem; }
    .form-group select, .form-group input {
      width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px;
      font-size: 1rem; transition: border-color 0.3s;
    }
    .form-group select:focus, .form-group input:focus {
      border-color: #3182ce; outline: none;
    }

    .btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
    .btn-primary { background: #3182ce; color: white; }
    .btn-primary:hover { background: #2b6cb0; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; }
    .btn-secondary:hover { background: #cbd5e0; }
    .actions { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .actions .btn { flex: 1; text-align: center; }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .card { padding: 1.5rem; }
      .actions { flex-direction: column; }
      .actions .btn { flex: none; width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="card-header">
      <h1 th:text="${pozycja.id == null} ? '➕ Dodaj pozycję' : '✏️ Edytuj pozycję'">Dodaj pozycję</h1>
      <p th:text="${pozycja.id == null} ? 'Dodaj nowe zajęcia do planu' : 'Zmień dane wybranej pozycji'">Wprowadź dane</p>
    </div>

    <form th:action="@{/pracownik/plany/pozycje/zapisz}" th:object="${pozycja}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="hidden" th:field="*{id}" />
      <input type="hidden" th:field="*{planZajec.id}" />

      <div class="form-group">
        <label for="przedmiot">Przedmiot <span style="color:#e53e3e;">*</span></label>
        <select id="przedmiot" th:field="*{przedmiot.id}" required>
          <option value="">— Wybierz przedmiot —</option>
          <option th:each="p : ${przedmioty}" th:value="${p.id}" th:text="${p.nazwa}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="prowadzacy">Prowadzący <span style="color:#e53e3e;">*</span></label>
        <select id="prowadzacy" th:field="*{prowadzacy.id}" required>
          <option value="">— Wybierz prowadzącego —</option>
          <option th:each="u : ${prowadzacy}" th:value="${u.id}" th:text="${u.username}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="sala">Sala <span style="color:#e53e3e;">*</span></label>
        <select id="sala" th:field="*{sala.id}" required>
          <option value="">— Wybierz salę —</option>
          <option th:each="s : ${sale}" th:value="${s.id}" th:text="${s.numerSali + ' (' + s.pojemnosc + ' os.)'}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="grupa">Grupa (opcjonalnie)</label>
        <select id="grupa" th:field="*{grupa.id}">
          <option value="">— Bez grupy —</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dzienTygodnia">Dzień tygodnia <span style="color:#e53e3e;">*</span></label>
        <select id="dzienTygodnia" th:field="*{dzienTygodnia}" required>
          <option value="">— Wybierz dzień —</option>
          <option th:each="d : ${dni}" th:value="${d}" th:text="${d}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="godzinaRozpoczecia">Godzina rozpoczęcia <span style="color:#e53e3e;">*</span></label>
        <input type="time" id="godzinaRozpoczecia" th:field="*{godzinaRozpoczecia}" required />
      </div>

      <div class="form-group">
        <label for="godzinaZakonczenia">Godzina zakończenia <span style="color:#e53e3e;">*</span></label>
        <input type="time" id="godzinaZakonczenia" th:field="*{godzinaZakonczenia}" required />
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">💾 Zapisz</button>
        <a th:href="@{/pracownik/plany/pozycje/{id}(id=${pozycja.planZajec.id})}" class="btn btn-secondary">❌ Anuluj</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
