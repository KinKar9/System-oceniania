<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>System Oceniania - Pracownicy</title>
</head>
<body>
<main>
  <h1 id="main-heading">Zarządzanie Pracownikami</h1>

  <div style="margin-bottom: 20px;">
    <a href="/pracownicy/nowy" role="button" aria-label="Przejdź do formularza dodawania nowego pracownika">➕ Dodaj nowego pracownika</a>
  </div>

  <section aria-label="Lista zarejestrowanych pracowników">
    <h2>Zarejestrowani pracownicy</h2>
    <table border="1">
      <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Tytuł naukowy</th>
        <th scope="col">Imię</th>
        <th scope="col">Nazwisko</th>
        <th scope="col">Akcje</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${pracownicy}">
        <td th:text="${p.id}">1</td>
        <td th:text="${p.tytulNaukowy}">Dr</td>
        <td th:text="${p.imie}">Jan</td>
        <td th:text="${p.nazwisko}">Kowalski</td>
        <td>
          <a th:href="@{/pracownicy/edycja/{id}(id=${p.id})}"
             th:aria-label="'Edytuj dane pracownika ' + ${p.imie} + ' ' + ${p.nazwisko}">Edytuj</a> |

          <a th:href="@{/pracownicy/usun/{id}(id=${p.id})}"
             th:aria-label="'Usuń pracownika ' + ${p.imie} + ' ' + ${p.nazwisko}"
             onclick="return confirm('Czy na pewno chcesz usunąć tego pracownika?')">Usuń</a>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
