<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Oceniania - Pracownicy</title>
  <style>
    /* WCAG 2.1: Wysoki kontrast, czytelność i widoczny focus dla klawiatury */
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.6;
      padding: 20px;
    }
    h1 { color: #0d47a1; }
    .btn {
      display: inline-block;
      padding: 10px 15px;
      background-color: #0d47a1;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      border: 2px solid transparent;
    }
    .btn-danger { background-color: #d32f2f; }
    .btn:hover, .btn:focus {
      background-color: #111111;
      color: #ffffff;
      outline: 3px solid #ffb300;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 2px solid #111111;
      padding: 12px;
      text-align: left;
    }
    th { background-color: #0d47a1; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>

<header>
  <nav aria-label="Menu główne">
    <a href="/przedmioty" style="margin-right: 15px;">Przedmioty</a>
    <a href="/pracownicy" style="font-weight: bold;">Pracownicy</a>
  </nav>
</header>

<main>
  <h1>Lista Pracowników Naukowo-Dydaktycznych</h1>

  <a th:href="@{/pracownicy/nowy}" class="btn">Dodaj nowego pracownika</a>

  <table>
    <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Tytuł naukowy</th>
      <th scope="col">Imię</th>
      <th scope="col">Nazwisko</th>
      <th scope="col">Akcje</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pracownik : ${pracownicy}">
      <td th:text="${pracownik.id}">1</td>
      <td th:text="${pracownik.tytulNaukowy}">dr inż.</td>
      <td th:text="${pracownik.imie}">Jan</td>
      <td th:text="${pracownik.nazwisko}">Kowalski</td>
      <td>
        <a th:href="@{/pracownicy/usun/{id}(id=${pracownik.id})}"
           class="btn btn-danger"
           th:onclick="return confirm('Czy na pewno chcesz usunąć tego pracownika?');">
          Usuń <span class="sr-only" th:text="${'pracownika ' + pracownik.imie + ' ' + pracownik.nazwisko}"></span>
        </a>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(pracownicy)}">
      <td colspan="5">Brak zarejestrowanych pracowników w systemie.</td>
    </tr>
    </tbody>
  </table>
</main>

</body>
</html>
