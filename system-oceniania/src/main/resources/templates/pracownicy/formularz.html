<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularz Pracownika</title>
</head>
<body>
<main>
    <h1 th:text="${pracownik.id == null} ? 'Dodaj nowego pracownika' : 'Edytuj pracownika'">Formularz</h1>

    <section aria-labelledby="form-heading">
        <h2 id="form-heading" th:text="${pracownik.id == null} ? 'Wprowadź dane nowego pracownika' : 'Zmień dane pracownika'">Dane</h2>

        <form th:action="@{/pracownicy/zapisz}" th:object="${pracownik}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="imie">Imię pracownika:</label>
                <input type="text" id="imie" th:field="*{imie}" aria-required="true" />
                <span th:if="${#fields.hasErrors('imie')}" th:errors="*{imie}" style="color: red;" role="alert">Błąd imienia</span>
            </div>

            <br/>

            <div>
                <label for="nazwisko">Nazwisko pracownika:</label>
                <input type="text" id="nazwisko" th:field="*{nazwisko}" aria-required="true" />
                <span th:if="${#fields.hasErrors('nazwisko')}" th:errors="*{nazwisko}" style="color: red;" role="alert">Błąd nazwiska</span>
            </div>

            <br/>

            <div>
                <label for="tytulNaukowy">Tytuł naukowy:</label>
                <input type="text" id="tytulNaukowy" th:field="*{tytulNaukowy}" />
                <span th:if="${#fields.hasErrors('tytulNaukowy')}" th:errors="*{tytulNaukowy}" style="color: red;" role="alert">Błąd tytułu</span>
            </div>

            <br/>

            <button type="submit" aria-label="Zatwierdź i zapisz formularz">Zapisz pracownika</button>
            <a href="/pracownicy" style="margin-left: 10px;">Anuluj</a>
        </form>
    </section>
</main>
</body>
</html>
