<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz Pracownika</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f4f7fa;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input {
            padding: 6px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #27ae60;
        }
        .error-message {
            color: red;
            font-size: 0.9em;
            display: block;
            margin-top: 4px;
        }
        .global-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
        }
        .actions {
            margin-top: 1.5rem;
        }
        .cancel-link {
            margin-left: 10px;
            color: #666;
            text-decoration: none;
        }
        .cancel-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main>
    <h1 th:text="${pracownik.id == null} ? 'Dodaj nowego pracownika' : 'Edytuj pracownika'">Formularz</h1>

    <section aria-labelledby="form-heading">
        <h2 id="form-heading" th:text="${pracownik.id == null} ? 'Wprowadź dane nowego pracownika' : 'Zmień dane pracownika'">Dane</h2>

        <form th:action="@{/pracownicy/zapisz}" th:object="${pracownik}" method="post" novalidate>
            <input type="hidden" th:field="*{id}" />
            <!-- Token CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Błędy globalne -->
            <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
            </div>

            <div class="form-group">
                <label for="imie">Imię pracownika:</label>
                <input type="text" id="imie" th:field="*{imie}" required aria-required="true" aria-describedby="imie-error" />
                <span id="imie-error" th:if="${#fields.hasErrors('imie')}" th:errors="*{imie}" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="nazwisko">Nazwisko pracownika:</label>
                <input type="text" id="nazwisko" th:field="*{nazwisko}" required aria-required="true" aria-describedby="nazwisko-error" />
                <span id="nazwisko-error" th:if="${#fields.hasErrors('nazwisko')}" th:errors="*{nazwisko}" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="tytulNaukowy">Tytuł naukowy:</label>
                <input type="text" id="tytulNaukowy" th:field="*{tytulNaukowy}" aria-describedby="tytul-error" />
                <span id="tytul-error" th:if="${#fields.hasErrors('tytulNaukowy')}" th:errors="*{tytulNaukowy}" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required aria-required="true" aria-describedby="email-error" />
                <span id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message" role="alert"></span>
            </div>

            <div class="actions">
                <button type="submit" aria-label="Zatwierdź i zapisz formularz">Zapisz pracownika</button>
                <a th:href="@{/pracownicy}" class="cancel-link" onclick="return confirm('Czy na pewno chcesz anulować? Wszystkie zmiany zostaną utracone.');">Anuluj</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
