<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz planu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            padding: 2rem;
        }
        .container { max-width: 600px; margin: auto; }
        h1 { color: white; font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 2rem; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #2d3748; }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #3182ce;
            outline: none;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #3182ce; color: white; }
        .btn-primary:hover { background: #2b6cb0; }
        .btn-secondary { background: #e2e8f0; color: #2d3748; }
        .btn-secondary:hover { background: #cbd5e0; }
        .actions { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
            height: 1.2rem;
            width: 1.2rem;
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${plan.id != null} ? '✏️ Edytuj plan' : '📝 Nowy plan zajęć'">Formularz</h1>

    <div class="card">
        <form th:action="@{/pracownik/plany/zapisz}" th:object="${plan}" method="post">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- NAZWA PLANU -->
            <div class="form-group">
                <label for="nazwa">Nazwa planu <span style="color: #e53e3e;">*</span></label>
                <input type="text" id="nazwa" th:field="*{nazwa}" required placeholder="np. Plan semestru zimowego" />
            </div>

            <!-- SEMESTR – Z DYNAMICZNĄ LISTĄ -->
            <div class="form-group">
                <label for="semestr">Semestr</label>
                <select id="semestr" th:field="*{semestr.id}">
                    <option value="">— Wybierz semestr —</option>
                    <!-- 🔥 LISTA SEMESTRÓW Z BAZY -->
                    <option th:each="s : ${semestry}" th:value="${s.id}" th:text="${s.nazwa}"></option>
                </select>
            </div>

            <!-- AKTYWNY -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="aktywny" th:field="*{aktywny}" />
                    <label for="aktywny">Aktywny</label>
                </div>
            </div>

            <!-- PRZYCISKI -->
            <div class="actions">
                <button type="submit" class="btn btn-primary">💾 Zapisz</button>
                <a th:href="@{/pracownik/plany}" class="btn btn-secondary">❌ Anuluj</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
