<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularz Przedmiotu</title>
</head>
<body>
<main>
    <h1 th:text="${przedmiot.id == null} ? 'Dodaj nowy przedmiot' : 'Edytuj przedmiot'">Formularz</h1>

    <section aria-labelledby="form-przedmiot">
        <h2 id="form-przedmiot" th:text="${przedmiot.id == null} ? 'Wprowadź dane nowego przedmiotu' : 'Zmień dane przedmiotu'">Dane przedmiotu</h2>

        <form th:action="@{/przedmioty/zapisz}" th:object="${przedmiot}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="kodPrzedmiotu">Kod przedmiotu:</label>
                <input type="text" id="kodPrzedmiotu" th:field="*{kodPrzedmiotu}" aria-required="true" />
                <span th:if="${#fields.hasErrors('kodPrzedmiotu')}" th:errors="*{kodPrzedmiotu}" style="color: red;" role="alert">Błąd kodu</span>
            </div>

            <br/>

            <div>
                <label for="nazwaPrzedmiotu">Nazwa przedmiotu:</label>
                <input type="text" id="nazwaPrzedmiotu" th:field="*{nazwa}" aria-required="true" />
                <span th:if="${#fields.hasErrors('nazwa')}" th:errors="*{nazwa}" style="color: red;" role="alert">Błąd nazwy</span>
            </div>

            <br/>

            <button type="submit" aria-label="Zatwierdź i zapisz przedmiot">Zapisz przedmiot</button>
            <a href="/przedmioty" style="margin-left: 10px;">Anuluj</a>
        </form>
    </section>
</main>
</body>
</html>
