<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Oceniania - Nowy Przedmiot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
            padding: 20px;
        }
        h1 { color: #0d47a1; }
        .form-group {
            margin-bottom: 15px;
            max-width: 400px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 2px solid #111111;
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: 3px solid #ffb300;
        }
        .btn {
            padding: 10px 20px;
            background-color: #0d47a1;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover, .btn:focus {
            background-color: #111111;
            outline: 3px solid #ffb300;
        }
        .btn-secondary {
            background-color: #efefef;
            color: #111111;
            border: 2px solid #111111;
            text-decoration: none;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<main>
    <h1>Dodaj Nowy Przedmiot</h1>

    <form th:action="@{/przedmioty/zapisz}" th:object="${przedmiot}" method="post">

        <div class="form-group">
            <label for="kod">Kod przedmiotu:</label>
            <input type="text" id="kod" th:field="*{kodPrzedmiotu}" required placeholder="np. INF-01"/>
        </div>

        <div class="form-group">
            <label for="nazwa">Nazwa przedmiotu:</label>
            <input type="text" id="nazwa" th:field="*{nazwa}" required placeholder="np. Programowanie w Javie"/>
        </div>

        <div class="form-group">
            <label for="kierunek">Kierunek studiów (ID):</label>
            <input type="number" id="kierunek" th:field="*{kierunek.id}" required placeholder="Wpisz ID istniejącego kierunku, np. 1"/>
        </div>

        <button type="submit" class="btn">Zapisz przedmiot</button>
        <a href="/przedmioty" class="btn btn-secondary">Anuluj</a>
    </form>
</main>

</body>
</html>
