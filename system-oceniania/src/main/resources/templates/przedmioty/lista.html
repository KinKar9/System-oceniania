<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Oceniania - Przedmioty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header h1 span {
            font-weight: 300;
            opacity: 0.8;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: white;
            color: #2d3748;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.4);
        }

        .btn-edit {
            background: #4299e1;
            color: white;
            padding: 0.3rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-edit:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-delete-sm {
            background: #fc8181;
            color: white;
            padding: 0.3rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-delete-sm:hover {
            background: #f56565;
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            text-decoration: none;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .table-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
        }

        thead th {
            color: white;
            padding: 1rem 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        thead th:first-child {
            border-radius: 12px 0 0 0;
        }

        thead th:last-child {
            border-radius: 0 12px 0 0;
        }

        tbody tr {
            transition: background 0.2s ease;
            border-bottom: 1px solid #edf2f7;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 0.9rem 1rem;
            color: #2d3748;
            vertical-align: middle;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .badge-ects { background: #c6f6d5; color: #22543d; }

        .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .actions form {
            display: inline;
        }

        .flash-message {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .flash-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }

        .flash-error {
            background: #fed7d7;
            color: #9b2c2c;
            border-left: 4px solid #e53e3e;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .empty-state h3 {
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .empty-state p {
            color: #718096;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
        }

        .footer span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header h1 { font-size: 1.6rem; }
            .table-wrapper { padding: 1rem; }
            table { font-size: 0.85rem; }
            thead th, tbody td { padding: 0.6rem 0.8rem; }
            .actions {
                flex-direction: column;
                gap: 0.3rem;
            }
            .btn-edit, .btn-delete-sm {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                flex-direction: column;
            }
            .btn {
                text-align: center;
            }
            table {
                font-size: 0.75rem;
            }
            thead th, tbody td {
                padding: 0.4rem 0.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ====== NAGŁÓWEK ====== -->
    <div class="header">
        <h1>📚 <span>Zarządzanie Przedmiotami</span></h1>
        <div class="header-actions">
            <a th:href="@{/przedmioty/nowy}" class="btn btn-primary">➕ Nowy przedmiot</a>
            <a th:href="@{/dashboard}" class="btn btn-back">← Powrót</a>
        </div>
    </div>

    <!-- ====== KOMUNIKATY ====== -->
    <div th:if="${flashMessage}" class="flash-message" th:classappend="${flashType == 'success' ? 'flash-success' : 'flash-error'}" th:text="${flashMessage}"></div>

    <!-- ====== TABELA ====== -->
    <div class="table-wrapper">
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Kod przedmiotu</th>
                    <th>Nazwa</th>
                    <th>ECTS</th>
                    <th style="text-align: center;">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${przedmioty == null or #lists.isEmpty(przedmioty)}">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <h3>Brak przedmiotów</h3>
                            <p>Kliknij przycisk "Nowy przedmiot" aby dodać pierwszy.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="p : ${przedmioty}" th:unless="${przedmioty == null or #lists.isEmpty(przedmioty)}">
                    <td th:text="${p.id}">1</td>
                    <td><strong th:text="${p.kodPrzedmiotu}">K001-01</strong></td>
                    <td th:text="${p.nazwa}">Przedmiot 1</td>
                    <td>
                        <span class="badge badge-ects" th:text="${p.ects} + ' ECTS'">5 ECTS</span>
                    </td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/przedmioty/edycja/{id}(id=${p.id})}" class="btn-edit">✏️ Edytuj</a>
                            <form th:action="@{/przedmioty/usun/{id}(id=${p.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn-delete-sm"
                                        onclick="return confirm('Czy na pewno chcesz usunąć przedmiot ${p.nazwa}?')">
                                    🗑️ Usuń
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ====== STOPKA ====== -->
    <div class="footer">
        <span>System Oceniania &bull; Zarządzanie przedmiotami</span>
    </div>
</div>

</body>
</html>
