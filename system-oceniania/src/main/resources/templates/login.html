<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie do Systemu Oceniania</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0055aa;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
        .info {
            color: green;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>System Oceniania – Logowanie</h2>
    <form th:action="@{/login}" method="post" autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div th:if="${param.error}" class="error">Nieprawidłowa nazwa użytkownika lub hasło</div>
        <div th:if="${param.logout}" class="info">Zostałeś wylogowany</div>

        <label for="username">Nazwa użytkownika:</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="off">

        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" required autocomplete="new-password">

        <button type="submit" aria-label="Zaloguj się do systemu">Zaloguj się</button>
    </form>
</div>
</body>
</html>
